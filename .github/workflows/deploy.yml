name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Show what the build produced
        run: |
          echo "--- vite.config.js as seen by CI ---"
          cat vite.config.js
          echo "--- project root ---"
          ls -la
          echo "--- dist ---"
          ls -la dist || echo "NO dist FOLDER"
          echo "--- docs ---"
          ls -la docs || echo "no docs folder"

      - name: SPA fallback
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing, see the listing above"; exit 1; }
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
